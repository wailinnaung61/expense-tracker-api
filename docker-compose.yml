# Local / multi-PC Docker Compose — API + Postgres + Redis
#
# First time on this PC:
#   1. Copy .env.example → .env  (set DOCKERHUB_USER + secrets)
#   2. docker compose up -d --build
#
# Push API image to Docker Hub (this PC):
#   .\scripts\deploy-dockerhub.ps1
#
# Other PC (Docker already installed):
#   1. Copy this repo (or at least compose + .env + docker/ + backups/)
#   2. Same .env with same DOCKERHUB_USER
#   3. docker compose pull api && docker compose up -d

services:
  api:
    image: ${DOCKERHUB_USER}/expense-tracker-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-tracker-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ExpenseTracker;Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-admin}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false,connectTimeout=10000,syncTimeout=10000,asyncTimeout=10000,connectRetry=3
      - AWS__Region=${AWS_REGION:-us-east-1}
      - AWS__AccessKey=${AWS_ACCESS_KEY:-}
      - AWS__SecretKey=${AWS_SECRET_KEY:-}
      - AWS__Cognito__UserPoolId=${COGNITO_USER_POOL_ID:-}
      - AWS__Cognito__ClientId=${COGNITO_CLIENT_ID:-}
      - AWS__Cognito__ClientSecret=${COGNITO_CLIENT_SECRET:-}
      - AWS__Cognito__Region=${AWS_REGION:-us-east-1}
      - AWS__EventBridge__EventBusName=default
      - AWS__EventBridge__Source=expense-tracker.export
      - AWS__S3__ExportBucketName=${S3_EXPORT_BUCKET:-}
      - AWS__S3__PresignedUrlExpiryMinutes=5
      - CorsSettings__AllowedOrigins__0=http://localhost:5173
      - CorsSettings__AllowedOrigins__1=http://localhost:8081
      - CorsSettings__AllowedOrigins__2=http://localhost:8082
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - OpenAI__Model=gpt-4o-mini
      # Local = in-process Excel (no Lambda). Production = EventBridge → SQS → Lambda.
      - Export__Mode=${EXPORT_MODE:-Local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: expense-tracker-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ExpenseTracker
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: expense-tracker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
